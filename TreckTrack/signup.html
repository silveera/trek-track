<!DOCTYPE html>
<html lang="en">

<head>
    <link rel="stylesheet" href="styles/style.css">
    <script src="scripts/main.js"></script>
    <meta charset="UTF-8">
</head>

<body>
    <div class="container">
        <form action="/php/signup-inc.php" method="POST">
            <input type="text" placeholder="Username" id="uid" required> <br>
            <input type="text" placeholder="Email" id="email" required> <br>
            <input type="password" placeholder="Password" id="pw" required> <br>
            <input type="password" placeholder="Repeat Password" id="pw-rpt" required> <br>

            <button type="submit">Create Account</button>
            
            <p id="or"> or </p>
            <button type="submit" id="facebook" formnovalidate>Continue with Facebook</button>
            <button type="submit" id="google" formnovalidate>Continue with Google</button>
            <p id="login">Have an account? <a href="login.html">LOG IN</a></p>
        </form>
    </div>
</body>

</html>
